name: SmartShop POS CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend API Tests & Linting
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: smartshop_pos_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, pdo_sqlite, bcmath, curl
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
        working-directory: backend/laravel-api

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/laravel-api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --optimize-autoloader
        working-directory: backend/laravel-api

      - name: Prepare Environment File
        run: |
          cp .env.example .env
          php artisan key:generate
        working-directory: backend/laravel-api

      - name: Run Database Migrations & Seeders
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: smartshop_pos_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan migrate --seed --force
        working-directory: backend/laravel-api

      - name: Execute Automated Test Suite (Pest/PHPUnit)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: smartshop_pos_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan test
        working-directory: backend/laravel-api

  desktop-pos-build:
    name: Windows Desktop POS Build (Electron + React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/windows-pos/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: apps/windows-pos

      - name: Build Web Bundle & Electron Processes
        run: npm run build:all
        working-directory: apps/windows-pos
